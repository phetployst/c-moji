<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>emoji copy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <h1>emoji<span>copy</span></h1>
        <h2>Click to copy emojis</h2>
      </div>
      <div class="controls">
        <input id="search" type="text" placeholder="Search emojis…" />
        <div class="skin-tone">
          <button class="active">🏻</button>
          <button>🏼</button>
          <button>🏽</button>
          <button>🏾</button>
          <button>🏿</button>
        </div>
      </div>

    </div>
  </header>

  <aside class="category-nav">
    <div id="categoryPopup" class="category-popup"></div>
  </aside>
  <div class="container">
    <div class="layout">


      <main id="emojiContainer"></main>
    </div>


    <div id="toast" class="toast">Copied!</div>

  </div>

  <div class="emoji-tray" id="emojiTray">
    <div class="tray-emojis" id="trayEmojis"></div>

    <div class="tray-actions">
      <button class="tray-clear" id="trayClear">Clear</button>
      <button class="tray-copy" id="trayCopy">Copy</button>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>

</html>
