name: Update Emoji Dataset

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download emoji dataset
        run: |
          mkdir -p raw
          curl -L \
            https://raw.githubusercontent.com/iamcal/emoji-data/master/emoji_pretty.json \
            -o raw/emojis.json

      - name: Generate emojis.json
        run: |
          node scripts/gen-emoji.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add raw/emojis.json data/emojis.json
          git commit -m "chore: update emoji dataset" || echo "No changes"
          git push
